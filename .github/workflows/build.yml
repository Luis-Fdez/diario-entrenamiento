name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # La clave de firma vive en los secrets del repo (el repo es público).
      # Sin ella el APK se firma con una clave de depuración temporal.
      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/diario.keystore
          else
            echo "::warning::Falta el secret KEYSTORE_BASE64: el APK no se podrá instalar encima de versiones anteriores."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk diario-entrenamiento-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: diario-entrenamiento-apk
          path: diario-entrenamiento-*.apk

      # Publica el APK como release: se descarga directamente desde el móvil.
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Versión 0.1.${{ github.run_number }}
          make_latest: true
          files: diario-entrenamiento-*.apk
